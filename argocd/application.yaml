apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortlink
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aibhuyan/shortlink-platform.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values-aks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
