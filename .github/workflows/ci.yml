name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Smoke-test backend imports
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/db
        run: uv run python -c "import main; print('backend imports OK')"

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shortlink-${{ matrix.name }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 ${{ env.IMAGE }}:${{ github.sha }}

      - name: Push image to GHCR
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}
