apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: shortlink
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: shortlink-platform-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shortlink-secret
                  key: DATABASE_URL
