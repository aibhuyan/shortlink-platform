server {
    listen 80;

    # 1. API requests → FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # 2. Serve the built SPA; anything that isn't a real file
    #    falls through to the backend (so short codes like /abc123 redirect)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @backend;
    }

    # 3. The fallback target used by try_files above
    location @backend {
        proxy_pass http://backend:8000;
    }
}
