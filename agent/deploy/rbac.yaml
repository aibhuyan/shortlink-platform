apiVersion: v1
kind: ServiceAccount
metadata:
  name: shortlink-agent
  namespace: shortlink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shortlink-agent-read
  namespace: shortlink
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shortlink-agent-read
  namespace: shortlink
subjects:
  - kind: ServiceAccount
    name: shortlink-agent
    namespace: shortlink
roleRef:
  kind: Role
  name: shortlink-agent-read
  apiGroup: rbac.authorization.k8s.io
